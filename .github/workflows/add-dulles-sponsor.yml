name: Add Dulles sponsor showcase

on:
  push:
    paths:
      - '.github/workflows/add-dulles-sponsor.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add confirmed sponsor section
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '''.sponsors-showcase{width:min(1180px,calc(100% - 40px));margin:auto;padding:20px 0 116px}.sponsors-showcase h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em;margin:0;font-size:clamp(44px,6vw,76px);line-height:1}.confirmed-sponsor{margin-top:38px;display:grid;grid-template-columns:minmax(260px,430px) 1fr;align-items:center;gap:50px;padding:34px;border:1px solid rgba(227,184,95,.35);background:linear-gradient(145deg,#151821,#0c0d12);box-shadow:0 28px 80px rgba(0,0,0,.35)}.confirmed-sponsor-logo{min-height:190px;display:grid;place-items:center;padding:22px;background:#000;border:1px solid var(--line);overflow:hidden}.confirmed-sponsor-logo img{display:block;width:100%;height:auto}.confirmed-sponsor-copy span{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.confirmed-sponsor-copy h3{font:clamp(34px,5vw,58px) Georgia;margin:13px 0 0;line-height:1.05}@media(max-width:760px){.confirmed-sponsor{grid-template-columns:1fr;gap:26px;padding:24px}.confirmed-sponsor-logo{min-height:150px}.sponsors-showcase{width:min(100% - 28px,1180px);padding-bottom:88px}}'''
          marker = '.sponsor-section{width:min(1180px,calc(100% - 40px));'
          if marker not in text:
              raise SystemExit('Sponsor CSS marker not found')
          text = text.replace(marker, css + marker, 1)

          section = '''<section class="sponsors-showcase" id="sponsors" aria-labelledby="sponsors-title">
  <p class="eyebrow" data-i18n="sponsorsEyebrow">Proud sponsor</p>
  <h2 id="sponsors-title" data-i18n="sponsorsTitle">Supporting this celebration.</h2>
  <article class="confirmed-sponsor">
    <div class="confirmed-sponsor-logo"><img src="/images/dulles-auto-body-paint-sponsor.svg" alt="Dulles Auto Body &amp; Paint sponsor logo" loading="lazy" /></div>
    <div class="confirmed-sponsor-copy"><span data-i18n="officialSponsor">Official event sponsor</span><h3>Dulles Auto Body &amp; Paint</h3></div>
  </article>
</section>

'''
          html_marker = '<section class="sponsor-section" id="sponsor">'
          if html_marker not in text:
              raise SystemExit('Sponsor section marker not found')
          text = text.replace(html_marker, section + html_marker, 1)

          json_marker = '      "telephone": "+1-202-390-0424"\n    },\n    "offers": {'
          json_replacement = '      "telephone": "+1-202-390-0424"\n    },\n    "sponsor": {\n      "@type": "Organization",\n      "name": "Dulles Auto Body & Paint"\n    },\n    "offers": {'
          if json_marker not in text:
              raise SystemExit('JSON-LD organizer marker not found')
          text = text.replace(json_marker, json_replacement, 1)

          translations = {
            'featuredPerformers:"Featured performers",naghmaName:': 'featuredPerformers:"Featured performers",sponsorsEyebrow:"Proud sponsor",sponsorsTitle:"Supporting this celebration.",officialSponsor:"Official event sponsor",naghmaName:',
            'featuredPerformers:"ځانګړي هنرمندان",naghmaName:': 'featuredPerformers:"ځانګړي هنرمندان",sponsorsEyebrow:"ویاړلی سپانسر",sponsorsTitle:"د دې جشن ملاتړ کوي.",officialSponsor:"د پروګرام رسمي سپانسر",naghmaName:',
            'featuredPerformers:"هنرمندان ویژه",naghmaName:': 'featuredPerformers:"هنرمندان ویژه",sponsorsEyebrow:"اسپانسر افتخاری",sponsorsTitle:"حامی این جشن.",officialSponsor:"اسپانسر رسمی برنامه",naghmaName:'
          }
          for old, new in translations.items():
              if old not in text:
                  raise SystemExit('Translation marker not found: ' + old)
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Dulles Auto Body sponsor showcase"
          git push
