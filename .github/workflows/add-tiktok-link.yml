name: Add TikTok footer link

on:
  push:
    paths:
      - '.github/workflows/add-tiktok-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add TikTok icon and link
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<div class="links"><span data-i18n="followTickets">Follow & tickets</span><div class="socials"><a class="social-icon" target="_blank" rel="noreferrer" aria-label="Empire Stage Group on Instagram" href="https://www.instagram.com/empirestagegroup/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></a><a class="social-icon" target="_blank" rel="noreferrer" aria-label="Get tickets on Eventbrite" href="https://www.eventbrite.com/e/the-107th-independence-day-of-afghanistan-registration-1992980656794?aff=oddtdtcreator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V7Z"></path><path d="M12 8.5v7"></path></svg></a></div></div>'

          new = '<div class="links"><span data-i18n="followTickets">Follow & tickets</span><div class="socials"><a class="social-icon" target="_blank" rel="noreferrer" aria-label="Empire Stage Group on Instagram" href="https://www.instagram.com/empirestagegroup/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></a><a class="social-icon" target="_blank" rel="noreferrer" aria-label="Empire Stage Group on TikTok" href="https://www.tiktok.com/@empire.stage.group"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v10.3a4.7 4.7 0 1 1-4-4.6"></path><path d="M14 3c.8 2.4 2.6 4.1 5 4.6"></path></svg></a><a class="social-icon" target="_blank" rel="noreferrer" aria-label="Get tickets on Eventbrite" href="https://www.eventbrite.com/e/the-107th-independence-day-of-afghanistan-registration-1992980656794?aff=oddtdtcreator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V7Z"></path><path d="M12 8.5v7"></path></svg></a></div></div>'

          if old not in text:
              raise SystemExit('Footer social links block was not found')

          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add TikTok footer link"
          git push
