name: Fix Naghma image and RTL fonts

on:
  push:
    paths:
      - '.github/workflows/fix-naghma-and-rtl-fonts.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update image crop and language fonts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          content = path.read_text(encoding='utf-8')

          icon_link = '  <link rel="icon" type="image/png" href="/images/empire-stage-group-favicon.png" />\n'
          font_links = '''  <link rel="icon" type="image/png" href="/images/empire-stage-group-favicon.png" />
          <link rel="preconnect" href="https://fonts.googleapis.com" />
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
          <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Vazirmatn:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
          '''
          if 'Noto+Naskh+Arabic' not in content:
              if icon_link not in content:
                  raise SystemExit('Could not find favicon link')
              content = content.replace(icon_link, font_links, 1)

          old_artist_css = '.artists{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:58px}.artist{border-top:1px solid var(--line);padding-top:16px}.visual{height:520px;position:relative;background:#0b0c10;overflow:hidden}.visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 18%;filter:saturate(.98) contrast(1.03);transition:transform .5s ease}.visual.two img{object-position:center 16%}.visual:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(8,9,13,.48),transparent 38%)}.artist:hover .visual img{transform:scale(1.025)}.artist h3{font:48px Georgia;margin:22px 0 6px}.artist p{color:var(--muted);line-height:1.7}'
          new_artist_css = '.artists{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:58px}.artist{border-top:1px solid var(--line);padding-top:16px}.visual{height:520px;position:relative;background:#0b0c10;overflow:hidden}.visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 18%;filter:saturate(.98) contrast(1.03);transition:transform .5s ease}.visual.naghma img{transform:scale(1.04);transform-origin:center center}.visual.two img{object-position:center 16%}.visual:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(8,9,13,.48),transparent 38%)}.artist:hover .visual img{transform:scale(1.025)}.artist:hover .visual.naghma img{transform:scale(1.065)}.artist h3{font:48px Georgia;margin:22px 0 6px}.artist p{color:var(--muted);line-height:1.7}'
          if '.visual.naghma img' not in content:
              if old_artist_css not in content:
                  raise SystemExit('Could not find artist CSS')
              content = content.replace(old_artist_css, new_artist_css, 1)

          rtl_css = '''    html[lang="ps"] body,html[lang="ps"] button,html[lang="ps"] input,html[lang="ps"] textarea,html[lang="ps"] select{font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif}
              html[lang="fa"] body,html[lang="fa"] button,html[lang="fa"] input,html[lang="fa"] textarea,html[lang="fa"] select{font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,Arial,sans-serif}
              html[lang="ps"] .hero h1,html[lang="ps"] .section h2,html[lang="ps"] .cta h2,html[lang="ps"] .sponsor-panel h2,html[lang="ps"] .countdown-section h2,html[lang="ps"] .artist h3,html[lang="ps"] .date strong,html[lang="ps"] .big,html[lang="ps"] .countdown-box strong,html[lang="ps"] .ticker div{font-family:"Noto Naskh Arabic",Tahoma,serif}
              html[lang="fa"] .hero h1,html[lang="fa"] .section h2,html[lang="fa"] .cta h2,html[lang="fa"] .sponsor-panel h2,html[lang="fa"] .countdown-section h2,html[lang="fa"] .artist h3,html[lang="fa"] .date strong,html[lang="fa"] .big,html[lang="fa"] .countdown-box strong,html[lang="fa"] .ticker div{font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,serif}
              html[dir="rtl"] body{line-height:1.8}html[dir="rtl"] .eyebrow,html[dir="rtl"] nav,html[dir="rtl"] .btn,html[dir="rtl"] .brand,html[dir="rtl"] .facts small,html[dir="rtl"] .countdown-box span,html[dir="rtl"] .field label,html[dir="rtl"] .poster-zoom{letter-spacing:0;text-transform:none}html[dir="rtl"] .hero h1,html[dir="rtl"] .section h2,html[dir="rtl"] .cta h2,html[dir="rtl"] .sponsor-panel h2,html[dir="rtl"] .countdown-section h2{letter-spacing:0;line-height:1.15}html[dir="rtl"] .lead,html[dir="rtl"] .artist p,html[dir="rtl"] .about p,html[dir="rtl"] .sponsor-panel p{line-height:2}
          '''
          if 'html[lang="ps"] body' not in content:
              marker = '    .mobile-actions{display:none}'
              if marker not in content:
                  raise SystemExit('Could not find CSS insertion marker')
              content = content.replace(marker, rtl_css + marker, 1)

          old_markup = '<article class="artist"><div class="visual"><img src="/images/naghma.webp"'
          new_markup = '<article class="artist"><div class="visual naghma"><img src="/images/naghma.webp"'
          if 'class="visual naghma"' not in content:
              if old_markup not in content:
                  raise SystemExit('Could not find Naghma image markup')
              content = content.replace(old_markup, new_markup, 1)

          path.write_text(content, encoding='utf-8')
          PY

      - name: Commit website fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Fix Naghma image crop and RTL fonts"
            git push
          fi
