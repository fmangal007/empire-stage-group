name: Update localized artist names

on:
  push:
    paths:
      - '.github/workflows/update-localized-artist-names.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update artist names in website and calendar
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'with live performances by Naghma and Hasib Sepand': 'with live performances by Naghma Jan and Hasib Sepand',
              'featuring Naghma and Hasib Sepand': 'featuring Naghma Jan and Hasib Sepand',
              '{"@type": "Person", "name": "Naghma"}': '{"@type": "Person", "name": "Naghma Jan"}',
              'Naghma%20and%20Hasib%20Sepand': 'Naghma%20Jan%20and%20Hasib%20Sepand',
              '<li><small data-i18n="featuredSingers">Featured singers</small>Naghma and Hasib Sepand</li>': '<li><small data-i18n="featuredSingers">Featured singers</small><span data-i18n="singerNames">Naghma Jan and Hasib Sepand</span></li>',
              '<img src="/images/naghma.webp" alt="Naghma, featured performer" loading="lazy" /></div><h3>Naghma</h3>': '<img src="/images/naghma.webp" alt="Naghma Jan, featured performer" loading="lazy" /></div><h3 data-i18n="naghmaName">Naghma Jan</h3>',
              '<img src="/images/hasib-sepand.webp" alt="Hasib Sepand, featured performer" loading="lazy" /></div><h3>Hasib Sepand</h3>': '<img src="/images/hasib-sepand.webp" alt="Hasib Sepand, featured performer" loading="lazy" /></div><h3 data-i18n="hasibName">Hasib Sepand</h3>',
              'Legendary Afghan singer appearing live': 'Naghma Jan, the legendary Afghan singer, appearing live',
              'د نغمه او حسیب سپند په ژوندیو': 'د نغمه جان او حسیب سپند په ژوندیو',
              'سندرغاړې نغمه د کلتور': 'سندرغاړې نغمه جان د کلتور',
              'با اجرای زنده نغمه و حسیب سپند': 'با اجرای زنده نغمه جان و حسیب سپند',
              'نغمه، آوازخوان نامدار افغانستان': 'نغمه جان، آوازخوان نامدار افغانستان',
              'featuredSingers:"Featured singers",dateLabel:': 'featuredSingers:"Featured singers",singerNames:"Naghma Jan and Hasib Sepand",dateLabel:',
              'featuredPerformers:"Featured performers",artistsTitle:': 'featuredPerformers:"Featured performers",naghmaName:"Naghma Jan",hasibName:"Hasib Sepand",artistsTitle:',
              'featuredSingers:"ځانګړي سندرغاړي",dateLabel:': 'featuredSingers:"ځانګړي سندرغاړي",singerNames:"نغمه جان او حسیب سپند",dateLabel:',
              'featuredPerformers:"ځانګړي هنرمندان",artistsTitle:': 'featuredPerformers:"ځانګړي هنرمندان",naghmaName:"نغمه جان",hasibName:"حسیب سپند",artistsTitle:',
              'featuredSingers:"خوانندگان ویژه",dateLabel:': 'featuredSingers:"خوانندگان ویژه",singerNames:"نغمه جان و حسیب سپند",dateLabel:',
              'featuredPerformers:"هنرمندان ویژه",artistsTitle:': 'featuredPerformers:"هنرمندان ویژه",naghmaName:"نغمه جان",hasibName:"حسیب سپند",artistsTitle:',
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              else:
                  text = text.replace(old, new)

          if missing:
              raise SystemExit('Expected text not found: ' + repr(missing))

          path.write_text(text, encoding='utf-8')

          ics = Path('public/afghanistan-independence-day-2026.ics')
          ics_text = ics.read_text(encoding='utf-8').replace(
              'Live performances by Naghma and Hasib Sepand.',
              'Live performances by Naghma Jan and Hasib Sepand.'
          )
          ics.write_text(ics_text, encoding='utf-8')

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/afghanistan-independence-day-2026.ics
          git diff --cached --quiet || git commit -m "Localize Naghma Jan and Hasib Sepand names"
          git push
